<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIR SPACE 話術中心</title>
<style>
html { font-size: 18px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif; background: linear-gradient(135deg,#e8a4b0 0%,#d4849a 40%,#c97090 100%); min-height: 100vh; padding: 16px; font-size: 1rem; line-height: 1.6; }
.wrap { max-width: 680px; margin: 0 auto; }
.header { text-align: center; padding: 12px 0 16px; }
.logo-box { display: inline-flex; flex-direction: column; align-items: center; background: #c97090; border-radius: 16px; padding: 14px 40px; margin-bottom: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
.logo-box div { color: white; letter-spacing: 0.4em; font-size: 1.35rem; font-weight: 600; line-height: 1.6; }
.header h1 { color: white; font-size: 1.8rem; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,0.15); }
.header p { color: rgba(255,255,255,0.88); font-size: 1rem; margin-top: 6px; }
.main-tabs { display: flex; gap: 8px; background: rgba(255,255,255,0.18); padding: 6px; border-radius: 16px; margin-bottom: 16px; }
.main-tab { flex: 1; padding: 12px 14px; border-radius: 12px; border: none; font-size: 1rem; font-weight: 700; color: rgba(255,255,255,0.85); background: transparent; cursor: pointer; transition: all .15s; }
.main-tab.active { background: white; color: #c97090; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.card { background: white; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); padding: 22px; }
.progress { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 18px; }
.step-dot { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; font-weight: 700; background: rgba(255,255,255,0.3); color: white; }
.step-dot.active { background: white; color: #c97090; box-shadow: 0 0 0 4px rgba(255,255,255,0.4); }
.step-dot.done { background: #c97090; color: white; border: 2px solid white; }
.step-line { width: 28px; height: 2px; background: rgba(255,255,255,0.3); }
.step-line.done { background: white; }
.section-title { font-weight: 700; color: #374151; margin-bottom: 14px; font-size: 1.15rem; }
.sub-title { font-size: 1rem; font-weight: 700; color: #c97090; margin-bottom: 10px; }
input[type=text], input[type=number], select { width: 100%; border: 1.5px solid #e5e7eb; border-radius: 10px; padding: 12px 16px; font-size: 1rem; outline: none; background: white; font-family: inherit; }
input:focus, select:focus { border-color: #c97090; box-shadow: 0 0 0 3px rgba(201,112,144,0.15); }
label { font-size: 0.95rem; color: #6b7280; display: block; margin-bottom: 6px; }
.btn-p { background: #c97090; color: white; border: none; font-weight: 600; padding: 13px 26px; border-radius: 12px; cursor: pointer; font-size: 1rem; }
.btn-p:hover { opacity: 0.88; }
.btn-p:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-s { background: white; color: #c97090; border: 1.5px solid #c97090; font-weight: 600; padding: 13px 26px; border-radius: 12px; cursor: pointer; font-size: 1rem; }
.btn-row { display: flex; justify-content: space-between; margin-top: 22px; gap: 12px; }
.region-btn { width: 100%; text-align: left; padding: 14px 18px; border-radius: 12px; border: 1.5px solid #e5e7eb; font-weight: 600; font-size: 1.05rem; color: #4b5563; cursor: pointer; background: white; margin-bottom: 10px; }
.region-btn.active { border-color: #c97090; background: #f5e0e8; color: #c97090; }
.store-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; padding-left: 8px; margin-bottom: 10px; }
.store-btn { padding: 12px 6px; border-radius: 10px; border: 1.5px solid #e5e7eb; font-size: 0.95rem; color: #4b5563; cursor: pointer; background: white; text-align: center; font-weight: 500; }
.store-btn.active { background: #c97090; color: white; border-color: #c97090; }
.toggle-row { display: flex; gap: 12px; margin-bottom: 14px; }
.toggle-btn { flex: 1; padding: 14px; border-radius: 12px; border: 1.5px solid #e5e7eb; font-weight: 600; font-size: 1.05rem; color: #6b7280; cursor: pointer; background: white; }
.toggle-btn.yes { background: #22c55e; color: white; border-color: #22c55e; }
.toggle-btn.no { background: #f87171; color: white; border-color: #f87171; }
.brand-box { border: 1.5px solid rgba(201,112,144,0.3); border-radius: 14px; padding: 16px; background: #fdf6f8; margin-bottom: 14px; }
.dept-box { border: 1.5px solid #86efac; border-radius: 14px; padding: 16px; background: #f0fdf4; margin-bottom: 14px; }
.price-box { border: 1.5px solid #fde68a; border-radius: 14px; padding: 16px; background: #fefce8; }
.calc-result { background: white; border-radius: 10px; padding: 14px; border: 1px solid #fde68a; margin-top: 12px; }
.calc-row { display: flex; justify-content: space-between; font-size: 0.95rem; padding: 5px 0; }
.calc-row.total { border-top: 1px solid #fde68a; padding-top: 8px; margin-top: 6px; font-weight: 700; font-size: 1.05rem; }
.tier-row { border-radius: 8px; padding: 6px 10px; font-size: 0.95rem; display: flex; justify-content: space-between; }
.tier-row.reached { background: #f5e0e8; }
.upgrade-tip { background: #fef9c3; color: #b45309; border-radius: 8px; padding: 10px 14px; font-size: 0.95rem; font-weight: 600; margin-top: 6px; }
.tier-card { background: white; border: 1px solid rgba(201,112,144,0.2); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.tier-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.tier-label { font-size: 1rem; font-weight: 700; color: #c97090; }
.tier-remove { font-size: 0.95rem; color: #fca5a5; cursor: pointer; background: none; border: none; }
.tier-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.add-tier-btn { font-size: 0.95rem; background: #f5e0e8; color: #c97090; border: none; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.tier-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.type-btn { width: 100%; text-align: left; padding: 16px 18px; border-radius: 12px; border: 2px solid #e5e7eb; font-weight: 600; font-size: 1.05rem; color: #4b5563; cursor: pointer; background: white; margin-bottom: 10px; }
.type-btn.active { border-color: #c97090; background: #f5e0e8; color: #c97090; }
.scenario-btn { width: 100%; text-align: left; padding: 14px 16px; border-radius: 12px; border: 1.5px solid #e5e7eb; cursor: pointer; background: white; margin-bottom: 8px; }
.scenario-btn.active { border-color: #c97090; background: #f5e0e8; }
.scenario-btn .s-label { font-size: 1.05rem; font-weight: 700; color: #374151; display: block; }
.scenario-btn .s-desc { font-size: 0.9rem; color: #9ca3af; margin-top: 3px; display: block; }
.style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.style-btn { text-align: left; padding: 14px 16px; border-radius: 12px; border: 1.5px solid #e5e7eb; cursor: pointer; background: white; }
.style-btn.active { border-color: #c97090; background: #f5e0e8; }
.style-btn .sl { font-size: 1.02rem; font-weight: 700; color: #374151; }
.style-btn .sd { font-size: 0.88rem; color: #9ca3af; margin-top: 3px; }
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 16px; border-radius: 12px; background: #f5e0e8; margin-bottom: 14px; }
.tag { font-size: 0.95rem; font-weight: 600; color: #c97090; }
.tag.gray { color: #6b7280; font-weight: 400; }
.script-box { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px; font-size: 1.05rem; color: #374151; white-space: pre-wrap; line-height: 1.85; max-height: 540px; overflow-y: auto; }
.copy-btn { font-size: 0.95rem; padding: 9px 16px; border-radius: 8px; border: 1.5px solid #c97090; color: #c97090; background: white; cursor: pointer; font-weight: 600; }
.copy-btn.copied { background: #22c55e; color: white; border-color: #22c55e; }
.reset-btn { font-size: 0.95rem; padding: 9px 16px; border-radius: 8px; border: 1.5px solid #d1d5db; color: #6b7280; background: white; cursor: pointer; }
.result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
.result-btns { display: flex; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mt4{margin-top:6px} .mt8{margin-top:10px} .mt12{margin-top:14px}
.footer { text-align: center; font-size: 0.82rem; color: rgba(255,255,255,0.65); margin-top: 16px; padding-bottom: 16px; }
.template-section { background: white; border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; border: 1.5px dashed #c97090; }
.template-section label { font-weight: 600; margin-bottom: 8px; color: #c97090; font-size: 1.02rem; display: block; }
.event-btn { display: block; width: 100%; text-align: left; font-size: 1rem; padding: 14px 16px; border-radius: 8px; border: 1.5px solid #c97090; color: #c97090; background: white; cursor: pointer; margin-bottom: 8px; font-weight: 600; }
.event-btn:hover { background: #f5e0e8; }
.handbook-toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.search-input-wrap { position: relative; }
.search-input { width: 100%; padding: 13px 16px 13px 44px; font-size: 1rem; border: 1.5px solid #e5e7eb; border-radius: 12px; }
.search-input:focus { border-color: #c97090; box-shadow: 0 0 0 3px rgba(201,112,144,0.15); outline: none; }
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 1.1rem; color: #9ca3af; }
.filter-chip-group { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 8px 14px; border-radius: 999px; border: 1.5px solid #e5e7eb; font-size: 0.92rem; font-weight: 600; color: #6b7280; background: white; cursor: pointer; transition: all .15s; white-space: nowrap; }
.chip.active { background: #c97090; color: white; border-color: #c97090; }
.chip.region.active { background: #6366f1; border-color: #6366f1; }
.handbook-stats { font-size: 0.92rem; color: #6b7280; margin-bottom: 12px; padding: 10px 14px; background: #f9fafb; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.handbook-stats strong { color: #c97090; font-size: 1.05rem; }
.topic-group { margin-bottom: 16px; }
.topic-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 2px solid #f5e0e8; }
.topic-header .topic-name { font-size: 1.05rem; font-weight: 700; color: #c97090; }
.topic-header .topic-count { font-size: 0.85rem; color: #9ca3af; background: #f5e0e8; padding: 2px 10px; border-radius: 999px; }
.qa-card { background: white; border: 1.5px solid #e5e7eb; border-radius: 14px; margin-bottom: 10px; overflow: hidden; transition: border-color .15s; }
.qa-card:hover { border-color: #c97090; }
.qa-card.open { border-color: #c97090; background: #fdf6f8; }
.qa-question { padding: 14px 16px; cursor: pointer; display: flex; align-items: flex-start; gap: 10px; }
.qa-question .q-icon { font-weight: 700; color: #c97090; font-size: 1rem; flex-shrink: 0; line-height: 1.5; }
.qa-question .q-text { flex: 1; font-size: 1rem; color: #374151; line-height: 1.5; font-weight: 500; }
.qa-question .q-region { font-size: 0.82rem; color: white; background: #6366f1; padding: 3px 10px; border-radius: 999px; flex-shrink: 0; font-weight: 600; line-height: 1.5; align-self: center; }
.qa-question .q-region.r-bei { background: #3b82f6; }
.qa-question .q-region.r-zhong { background: #10b981; }
.qa-question .q-region.r-nan { background: #f59e0b; }
.qa-question .q-toggle { color: #9ca3af; font-size: 1.05rem; flex-shrink: 0; transition: transform .2s; align-self: center; }
.qa-card.open .q-toggle { transform: rotate(180deg); }
.qa-answer { padding: 0 16px 14px 38px; display: none; }
.qa-card.open .qa-answer { display: block; }
.qa-answer .a-text { background: #f9fafb; border-left: 3px solid #c97090; padding: 12px 14px; border-radius: 6px; font-size: 1rem; color: #4b5563; line-height: 1.75; white-space: pre-wrap; }
.qa-answer .a-actions { margin-top: 8px; display: flex; gap: 8px; justify-content: flex-end; }
.qa-copy-btn { font-size: 0.88rem; padding: 6px 14px; border-radius: 6px; border: 1px solid #c97090; color: #c97090; background: white; cursor: pointer; font-weight: 600; }
.qa-copy-btn.copied { background: #22c55e; color: white; border-color: #22c55e; }
.empty-state { text-align: center; padding: 40px 20px; color: #9ca3af; }
.empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
.empty-state .empty-text { font-size: 1rem; }
.highlight { background: #fef08a; padding: 1px 3px; border-radius: 3px; font-weight: 600; }
.collapse-controls { display: flex; gap: 8px; }
.collapse-btn { font-size: 0.88rem; padding: 6px 12px; border-radius: 6px; border: 1px solid #e5e7eb; color: #6b7280; background: white; cursor: pointer; }
.collapse-btn:hover { border-color: #c97090; color: #c97090; }
</style>
</head>
<body>
<div id="login-screen" style="position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#e8a4b0 0%,#d4849a 40%,#c97090 100%);display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="background:white;border-radius:20px;padding:32px 28px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.25);">
    <div style="text-align:center;margin-bottom:24px;">
      <div style="display:inline-flex;flex-direction:column;align-items:center;background:#c97090;border-radius:14px;padding:12px 32px;margin-bottom:14px;">
        <div style="color:white;letter-spacing:0.4em;font-size:1.2rem;font-weight:600;line-height:1.5;">A I R</div>
        <div style="color:white;letter-spacing:0.4em;font-size:1.2rem;font-weight:600;line-height:1.5;">S P A C E</div>
      </div>
      <h1 style="font-size:1.4rem;color:#374151;font-weight:700;margin:0;">話術中心 · 登入</h1>
      <p style="font-size:0.92rem;color:#9ca3af;margin-top:6px;">請使用公司電郵登入</p>
    </div>
    <div id="login-error" style="display:none;background:#fef2f2;color:#b91c1c;padding:10px 14px;border-radius:8px;font-size:0.92rem;margin-bottom:14px;border:1px solid #fecaca;"></div>
    <div style="margin-bottom:14px;">
      <label style="display:block;font-size:0.92rem;color:#6b7280;margin-bottom:6px;font-weight:500;">📧 公司電郵</label>
      <input type="email" id="login-email" placeholder="your-name@airspaceonline.com" autocomplete="email" style="width:100%;border:1.5px solid #e5e7eb;border-radius:10px;padding:12px 14px;font-size:1rem;outline:none;font-family:inherit;">
    </div>
    <div style="margin-bottom:18px;">
      <label style="display:block;font-size:0.92rem;color:#6b7280;margin-bottom:6px;font-weight:500;">🔐 密碼</label>
      <input type="password" id="login-password" placeholder="請輸入密碼" autocomplete="current-password" style="width:100%;border:1.5px solid #e5e7eb;border-radius:10px;padding:12px 14px;font-size:1rem;outline:none;font-family:inherit;">
    </div>
    <button id="login-submit" onclick="doLogin()" style="width:100%;background:#c97090;color:white;border:none;font-weight:600;padding:14px;border-radius:10px;cursor:pointer;font-size:1rem;">登入</button>
    <div style="margin-top:16px;padding:10px 12px;background:#fdf6f8;border-radius:8px;font-size:0.85rem;color:#9ca3af;line-height:1.5;">
      💡 登入一次,24 小時內不需再次輸入<br>
      ⚠️ 請勿轉發網址或密碼給非公司同仁
    </div>
  </div>
</div>

<div id="main-app" style="display:none;">
<div class="wrap">
  <div class="header">
    <div class="logo-box"><div>A I R</div><div>S P A C E</div></div>
    <h1>話術中心</h1>
    <p>產生器 × 話術手卡 280 筆</p>
  </div>
  <div class="main-tabs">
    <button class="main-tab active" id="tab-gen" onclick="switchTab('gen')">🎯 話術產生器</button>
    <button class="main-tab" id="tab-book" onclick="switchTab('book')">📚 話術手卡 (280)</button>
  </div>
  <div id="view-gen">
    <div class="progress" id="progress"></div>
    <div class="card" id="card"></div>
  </div>
  <div id="view-book" style="display:none">
    <div class="card" id="book-card"></div>
  </div>
  <div class="footer">
    AIR SPACE 話術中心 · 內含 280 筆精華話術手卡<br>
    <button onclick="doLogout()" style="margin-top:8px;background:transparent;border:1px solid rgba(255,255,255,0.4);color:rgba(255,255,255,0.85);font-size:0.78rem;padding:4px 12px;border-radius:6px;cursor:pointer;">🚪 登出</button>
  </div>
</div>

ion":"官網這件洋裝怎麼跟實體顏色有點落差,我覺得實體比較好看耶","answer":"歐膩妳真的有眼光特地來門市看實品,還有我們親切的服務:),官網照有時會因為拍攝環境,手法與實際商品的光澤度有點差異,但這件是上身很修飾您要穿看看嗎?"},{"category":"商品材質(版型)","topic":"會不會掉色","region":"北區","question":"這個褲子的刷色會褪色嗎?","answer":"您好,如果想保持此款牛仔褲的刷色建議清洗次數不要太頻繁,如真的需要清洗的話可以將牛仔褲翻面並套上洗衣袋唷,最後在提醒您不要使用烘衣機烘褲子喔"},{"category":"商品材質(版型)","topic":"會不會掉色","region":"中區","question":"牛仔褲下水洗後會褪色嗎?跟其他衣服洗會不會染色?","answer":"深色衣物第一次下水洗建議跟其他衣服分開,後續清洗也需深淺色分開洗滌,另外衣物不建議在陽光下曝曬太久唷~會導致纖維受損、褪色發黃"},{"category":"商品材質(版型)","topic":"洗滌保養","region":"北區","question":"這件泳衣的建議清洗方式是機洗還是手洗?可以脫水嗎?","answer":"泳衣因是特殊材質,會建議手洗,並搭配中性溫和洗劑,這樣可以延長商品的使用壽命喔~"},{"category":"商品材質(版型)","topic":"洗滌保養","region":"南區","question":"你們家的衣服要怎麼洗?我都用洗衣機耶","answer":"您好小姐,這件商品材質可以用洗衣機洗喔,建議幫我裝洗衣袋好嗎?這樣一來,可以延長衣服的壽命喔!如果有其他特殊面料的材質的服飾,我們都建議乾洗或手洗喔"},{"category":"商品材質(版型)","topic":"洗滌保養","region":"北區","question":"有bra的衣服可以直接丟洗衣機洗嗎?皮革/麂皮可以洗嗎","answer":"1. 有 bra 設計的衣服會比較建議以手洗方式清潔喔\n可以使用手洗精加水浸泡約 15 分鐘後輕柔清洗,擰乾後放置陰涼通風處晾乾即可\n\n如果覺得手洗較麻煩,機洗時也一定要使用有鋼圈保護的洗衣袋,或先將襯墊取出後再放入洗衣袋清洗,比較不容易造成胸墊變形\n\n2. 皮革/麂皮材質本身較不建議直接水洗,因容易破壞材質,後續可能產生脫皮或變硬的狀況,日常清潔會建議以微濕布輕擦表面即可"},{"category":"商品材質(版型)","topic":"洗滌保養","region":"北區","question":"這件有附胸墊的衣服回去可以丟洗衣機嗎?要怎麼洗?","answer":"美女~因為這款有特殊剪裁(或內含立體胸墊),強烈建議您用中性洗劑簡單手洗,這樣最能維持它的版型!如果真的想用機洗,一定要記得先把襯墊拆下來,或者放入有鋼圈保護的專用洗衣袋,翻面後用弱速洗滌,就可以穿得長長久久喔!"},{"category":"商品材質(版型)","topic":"洗滌保養","region":"中區","question":"皮革要怎麼洗","answer":"美女通常皮革不建議常清洗,若要清洗的話建議反面洗反面曬,家裡若有皮革保養油也可以薄薄擦拭,建議衣櫥保持乾燥,衣服掛起來不要折放會比較不會裂喔"},{"category":"商品材質(版型)","topic":"洗滌保養","region":"北區","question":"起毛球怎麼辦","answer":"這款材質一般正常穿著跟清洗下都不太會起毛球,建議回去可以翻面洗或放洗衣袋,可以維持更好喔!"},{"category":"商品材質(版型)","topic":"版型挑選","region":"北區","question":"現場很多寬褲,希望可以多出一點喇叭褲跟窄管褲,版型大一點。你們上衣的長度感覺都很短,會不會很顯胖?","answer":"1.這邊會反饋公司您的建議,您也可以加入我們社群關注我們接下來的新品資訊。\n2.我們上衣長度大約落在肚臍,可以搭配我們家的高腰褲,在整體的比例修飾度會很高。但如果您衣長想再長一點的話,這邊建議可以再多帶大一號,長度也會比較長呦"},{"category":"商品材質(版型)","topic":"版型挑選","region":"南區","question":"這件穿起來顯瘦嗎?","answer":"小姐您好,你的眼光真好,這件是我們店主打商品,穿起來腰身不僅漂亮,還會也適合搭配任何材質的上衣喔,建議妳要不要試穿看看?我幫您準備尺寸"},{"category":"商品材質(版型)","topic":"版型挑選","region":"北區","question":"我肚子明顯大的,我想要修飾身形的?","answer":"我覺得美女可以試穿不同風格,首先我會拿2-3套給您試穿搭配,您在跟我說喜歡哪種感覺。"},{"category":"商品材質(版型)","topic":"版型挑選","region":"北區","question":"這個版型穿起來會顯瘦嗎?你們的衣服都好短穿起來回不會很胖?","answer":"1.盡意您可以挑選Ａ自版型的下身,穿起來非常修飾臀部線條。\n2.我們的下身都是做高腰的款式,搭配短版上衣不但不會露肚子比例還會很好看。"},{"category":"商品材質(版型)","topic":"版型挑選","region":"中區","question":"這件版型穿起來會顯瘦嗎?","answer":"這款它的版型不會太貼身,穿起來會自然順身,加上剪裁有把身形線條修飾出來,所以視覺上會有比較顯瘦、拉長比例的感覺~\n而且它不太會貼小腹或臀部,整體穿起來是舒服的,很多客人試穿後都會覺得比想像中修身!"},{"category":"商品材質(版型)","topic":"版型挑選","region":"北區","question":"這款裙子有修飾臀部效果嗎?我有假跨寬","answer":"有的!這款版型在臀部線條有做修飾,不會貼假跨寬的位置,我可以幫您搭配上身,整體會更顯瘦"},{"category":"商品材質(版型)","topic":"透氣度&季節穿搭","region":"南區","question":"這件穿起來會不會太熱?夏天穿這個真的會比較涼感嗎?","answer":"哈囉歐膩,我們店這件保暖衣很適合我們南部的天氣(洋蔥式穿法)因為這材質可以鎖住我們身上的體溫,也很適合出國旅遊穿。這款式屬於涼感較透氣的材質,相對一般上衣來的更薄更涼感喔,要不要試穿看看,保證一穿成主顧,我幫您拿尺寸好嗎?"},{"category":"商品材質(版型)","topic":"透氣度&季節穿搭","region":"北區","question":"我想要找夏天可以穿的長褲,但因為我膚質較敏感,不想要悶熱感,請問有推薦的嗎。(冬天)我想出去玩拍照好看不要太厚重的衣服","answer":"1.我們今年有推出天絲材質的下身,夏天穿很舒服,較不會悶熱\n2.你可以看我們家的發熱系列,很百搭,如果你怕冷可以穿在針織裡面,我自己是很常單穿搭外套,簡單搭配加個飾品就可以拍出好看的照片了"},{"category":"商品材質(版型)","topic":"透氣度&季節穿搭","region":"南區","question":"會不會很熱?","answer":"有分版型挺得跟版型軟的\n版型軟的一定比較輕薄但立體感及俐落度是版型挺的\n無法相同比擬的~\n所以可以趁現在有優惠兩個款式一起帶"},{"category":"商品材質(版型)","topic":"透氣度&季節穿搭","region":"中區","question":"我過幾天要出國,但跟台灣氣溫弱差很大,我不曉得要買怎樣的衣服","answer":"如果是要去海島國家:我們有出多款涼感材質、天絲材質的衣服及褲子,穿起來親膚透氣,怕熱的話非常適合唷!/如果是要去寒冷的地方:我們家的發熱系列真的必帶!CP值跟顏值都很高,重點是可以單穿~"},{"category":"商品材質(版型)","topic":"透氣度&季節穿搭","region":"北區","question":"這個發熱背心適合夏天穿嗎","answer":"我們的發熱背心有通過 SGS 認證,材質本身是具有有效發熱機能的喔\n\n這季設計也有因應近年暖冬趨勢,因此沒有另外做刷絨設計,整體會比以往看起來更輕薄一些,但仍屬於保暖型商品\n\n因此還是不太建議於夏天穿著;如果是夏季日常搭配,會更推薦選擇涼感系列背心,整體透氣度與體感溫度都會相對更舒適、涼爽喔"},{"category":"商品材質(版型)","topic":"透氣度&季節穿搭","region":"北區","question":"(夏天)下禮拜要去泰國有適合的衣服嗎(冬天)現在門市有發熱衣嗎","answer":"1.我們目前有涼感系列背心洋裝很適合夏天出遊,另外還可以看一下我們天絲牛仔系列也是近期熱賣款喔\n2.有的 引導客人到發熱主題區介紹商品特性說明有做專利加熱5度"},{"category":"庫存調貨","topic":"下架款還買得到嗎","region":"北區","question":"官網有這件商品,你們這邊可以試穿嗎?或是有同版型可以試試看嗎?","answer":"官網與門市是分開的,不過門市剛好有同款或相同版型,我可以幫您找類似版型讓您先試穿喔~"},{"category":"庫存調貨","topic":"下架款還買得到嗎","region":"北區","question":"我想找你們上一季出的一款長褲,現場還有嗎?","answer":"美女,幫妳查詢後這款因為太熱銷,門市跟官網系統都已經全數下架絕版了。不過我們這週剛到貨的新品,有一款延續了那件褲子一模一樣的顯瘦高腰版型,但是材質變得更透氣、更好穿,我拿給妳試穿看看,妳一定會喜歡!"},{"category":"庫存調貨","topic":"下架款還買得到嗎","region":"南區","question":"這個還會再上架嗎","answer":"我幫您看看管網還有沒有販售喔,若官網也下架建議您可以看其他類似商品,我帶您看看類似的新款 設計感更好喔"},{"category":"庫存調貨","topic":"下架款還買得到嗎","region":"中區","question":"我在兩年前有買一條裙子,最近還有出嗎?想再買一條","answer":"美女經過確認這款全省已無貨,官網也無販售了,現在店裡有類似款,可以試穿看看~"},{"category":"庫存調貨","topic":"下架款還買得到嗎","region":"中區","question":"我前幾個月有看到一件商品,但今天看的時候已經沒有了,我很喜歡那件,請問還可以購買嗎?","answer":"門市主要是以新品及熱銷款式為主,過季商品如要購買的話可以到官網上看還有沒有貨,我幫您查詢這件目前網路上還買不買得到"},{"category":"庫存調貨","topic":"商品保留規則","region":"北區","question":"這件可以先幫我留著嗎?我今天趕時間,這週末才可以過來買。","answer":"可以的,沒問題!我幫妳開一張保留單,我們公司規定未付商品最長可以幫您保留3天(到這週日)。建議美女也可以加入我們門市的 LINE社群,如果週末行程有變動,直接隨時在賴上面跟我們說,我們再幫妳協調時間喔!"},{"category":"庫存調貨","topic":"商品保留規則","region":"中區","question":"這件你們現場沒貨,可是我沒試穿不知道我適不適合,可以試穿完再決定要不要買嗎?","answer":"沒問題唷~可以先幫美女調貨來試穿看看~我們未結商品可以保留三天~等到貨來現場試穿完再決定要不要帶回家~"},{"category":"庫存調貨","topic":"商品保留規則","region":"南區","question":"嗯...小姐我想要搭配百貨LINE PAY滿2500現抵100,我可以禮拜六結帳嗎","answer":"您好小姐,方便幫我們押訂金嗎? 這裡的商品全數就會保留給您,到時候您要刷卡付現都可以喔"},{"category":"庫存調貨","topic":"商品保留規則","region":"北區","question":"可以幫忙保留商品嗎?","answer":"可以唷!您想要甚麼款式、尺寸顏色,幫您確認,那告知美女未付商品會幫您保留三天,您在過來試穿唷"},{"category":"庫存調貨","topic":"商品保留規則","region":"南區","question":"可以保留多久呢?","answer":"美女您好,未結帳的商品只能保留3天喔,如有特殊狀況可以再來電告知我們"},{"category":"庫存調貨","topic":"商品保留規則","region":"中區","question":"我一定要三天內來拿嗎?","answer":"公司規定只保留一個月~如果小姐沒辦法時間內來拿可以寄給妳喔~"},{"category":"庫存調貨","topic":"查詢各門市庫存","region":"北區","question":"可以幫我查其他門市嗎?請問新莊宏匯有這件嗎?","answer":"可以的~我幫您查詢其他門市庫存看看,新莊宏匯我也幫您一起確認喔~有結果會馬上跟您說,您可以再看一下其他商品喔~"},{"category":"庫存調貨","topic":"查詢各門市庫存","region":"中區","question":"哪間店還有?可以直接幫我留嗎?","answer":"我幫您查全台庫存,看哪間店可以最快拿到\n如果有我要先幫您保留,避免熱門款被賣掉"},{"category":"庫存調貨","topic":"查詢各門市庫存","region":"南區","question":"可以幫我查詢這一款商品大小尺碼有再販售嗎?我想要L或XL的尺寸","answer":"美女方便給一下商品的條碼嗎?幫妳做查詢,目前門市有XL尺寸喔,小尺寸為小尺碼再 function escHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function escAttr(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function highlightHtml(s,kw){
  const esc=escHtml(s);
  if(!kw||!kw.trim())return esc;
  const k=kw.trim();
  const escK=k.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const re=new RegExp("("+escK.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return esc.replace(re,'<span class="highlight">$1</span>');
}

function filterHandbook(){
  return HANDBOOK_DATA.filter(item=>{
    if(HB.category!=="全部"&&item.category!==HB.category)return false;
    if(HB.region!=="全部"&&item.region!==HB.region)return false;
    if(HB.search.trim()){
      const kw=HB.search.trim().toLowerCase();
      const text=(item.question+" "+item.answer+" "+item.topic).toLowerCase();
      if(!text.includes(kw))return false;
    }
    return true;
  });
}

function copyQa(id,ev){
  ev.stopPropagation();
  const item=HANDBOOK_DATA[id];
  if(!item)return;
  navigator.clipboard.writeText(item.answer).then(()=>{
    const btn=document.getElementById("qcp-"+id);
    if(btn){
      const orig=btn.textContent;
      btn.textContent="✓ 已複製";
      btn.classList.add("copied");
      setTimeout(()=>{btn.textContent=orig;btn.classList.remove("copied");},1500);
    }
  });
}


function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const result=[];
  for(const line of lines){
    const row=[];let cur="",inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){inQ=!inQ;}
      else if(ch===','&&!inQ){row.push(cur);cur="";}
      else{cur+=ch;}
    }
    row.push(cur);result.push(row);
  }
  return result;
}
// === 解析「起訖日期」欄位 (e.g. "5/18-5/31"、"1/19-2/1"、"3/30"、"長期"、"4/15起") ===
function parseRangeDate(rangeStr, year){
  if(!rangeStr) return {start:null, end:null, kind:"none"};
  const s = rangeStr.trim();
  // 長期類:長期、活動送完為止、X/X起、X/X起送完為止
  if(/長期|送完為止|至送完/.test(s)) return {start:null, end:null, kind:"longterm"};
  // 純 "X/X起" 沒結束日 → 當作從 X/X 起的長期
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\s*起/);
  if(m){
    const start = new Date(year, parseInt(m[1])-1, parseInt(m[2]));
    return {start, end:null, kind:"openend"};
  }
  // 範圍 "M/D-M/D" 或 "M/D-M/D" (中間可能跨月)
  m = s.match(/^(\d{1,2})\/(\d{1,2})\s*[-~–—]\s*(\d{1,2})\/(\d{1,2})/);
  if(m){
    const sm = parseInt(m[1]), sd = parseInt(m[2]);
    const em = parseInt(m[3]), ed = parseInt(m[4]);
    const start = new Date(year, sm-1, sd);
    let endYear = year;
    // 結束月份小於開始月份 → 跨年 (例如 12/26-1/4)
    if(em < sm) endYear = year + 1;
    const end = new Date(endYear, em-1, ed);
    return {start, end, kind:"range"};
  }
  // 單日 "M/D"
  m = s.match(/^(\d{1,2})\/(\d{1,2})$/);
  if(m){
    const d = new Date(year, parseInt(m[1])-1, parseInt(m[2]));
    return {start:d, end:d, kind:"single"};
  }
  return {start:null, end:null, kind:"unknown"};
}

// === 解析「活動內容」抽出折扣與滿額資訊 ===
function parseActivityContent(content){
  if(!content) return {discount:"", tiers:[]};
  const tiers = [];
  let discount = "";

  // 抓 X折 或 X件Y折 (例如 "85折"、"兩件88折"、"三件85折"、"單件95折")
  const discountPatterns = [
    /([兩二三四五六]|單)件以上(\d+(?:\.\d+)?)折/g,
    /([兩二三四五六]|單)件(\d+(?:\.\d+)?)折/g,
    /全館(\d+(?:\.\d+)?)折/g,
    /(\d+(?:\.\d+)?)折/g
  ];
  const found = new Set();
  for(const pat of discountPatterns){
    let m;
    while((m = pat.exec(content)) !== null){
      const rate = m[m.length-1];
      if(!found.has(rate)){
        found.add(rate);
        const desc = m[0];
        if(!discount) discount = desc;
        else discount += "、" + desc;
      }
    }
  }

  // 抓「滿 X 折 Y」、「滿 X 再折 Y」、「滿 X 送 / 贈 Y」
  // 模式 1: 滿X折Y / 滿X再折Y
  const re1 = /滿\s*(\d+)\s*(?:再)?折\s*(\d+)/g;
  let mm;
  while((mm = re1.exec(content)) !== null){
    tiers.push({threshold:mm[1], cashOff:mm[2], giftName:""});
  }
  // 模式 2: 滿X贈Y / 滿X送Y
  const re2 = /滿\s*(\d+)\s*[贈送]\s*([^,;、。\s]{2,30})/g;
  while((mm = re2.exec(content)) !== null){
    const gift = mm[2].replace(/[,。;].*$/, '').trim();
    // 如果已經有同 threshold 的 tier 就加 gift
    const exist = tiers.find(t => t.threshold === mm[1]);
    if(exist){ if(!exist.giftName) exist.giftName = gift; }
    else tiers.push({threshold:mm[1], cashOff:"", giftName:gift});
  }
  return {discount, tiers};
}

function csvToEvents(rows){
  if(rows.length<2)return[];
  const headers=rows[0].map(h=>h.trim());
  const idxOf = name => headers.findIndex(h => h === name);
  const iYear = idxOf("年度");
  const iMonth = idxOf("月份");
  const iRange = idxOf("起訖日期");
  const iType = idxOf("活動類型");
  const iContent = idxOf("活動內容");
  const iStore = idxOf("適用門市/通路");
  const iStatus = idxOf("狀態");
  const iNote = idxOf("備註");

  const events=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    if(!r || r.length === 0) continue;
    const year = parseInt((r[iYear]||"").trim()) || new Date().getFullYear();
    const range = (r[iRange]||"").trim();
    const type = (r[iType]||"").trim();
    const content = (r[iContent]||"").trim();
    const store = (r[iStore]||"").trim();
    const status = (r[iStatus]||"").trim();
    const note = (r[iNote]||"").trim();

    if(!content && !range) continue;

    const dt = parseRangeDate(range, year);
    const parsed = parseActivityContent(content);

    events.push({
      name: content.length > 40 ? content.slice(0, 40) + "…" : content,
      fullContent: content,
      type, store, status, note,
      year,
      rangeStr: range,
      startDate: dt.start,
      endDate: dt.end,
      dateKind: dt.kind,
      discount: parsed.discount,
      tiers: parsed.tiers,
      special: ""
    });
  }
  return events;
}

function isCurrent(ev){
  const n = new Date(); n.setHours(0,0,0,0);
  // 取消狀態直接過濾
  if(ev.status === "取消") return false;
  if(ev.dateKind === "longterm") return true;
  if(ev.dateKind === "openend" && ev.startDate && n >= ev.startDate) return true;
  if(ev.dateKind === "range" && ev.startDate && ev.endDate){
    return n >= ev.startDate && n <= ev.endDate;
  }
  if(ev.dateKind === "single" && ev.startDate){
    const s = new Date(ev.startDate); s.setHours(0,0,0,0);
    return n.getTime() === s.getTime();
  }
  return false;
}

function isUpcoming(ev){
  if(ev.status === "取消") return false;
  const n = new Date(); n.setHours(0,0,0,0);
  if(!ev.startDate) return false;
  const d = (ev.startDate - n)/(1000*60*60*24);
  return d > 0 && d <= 14;
}

// === 同檔期版本過濾:只保留最新狀態 ===
function dedupeByLatestVersion(events){
  // 狀態優先序 (越後面越新)
  const statusOrder = {"原訂":1, "搶先開跑":2, "原訂(後改)":2, "日期調整":3, "補充":3, "加碼":3, "獨家加碼":3, "調整後":4, "再次調整":5, "延長":6, "系統調整":7, "取消":99, "原訂(後取消)":99, "原訂(後延長)":5, "長期":1};
  // 用 (起訖日期 + 活動類型 簡述) 當 key
  const groups = {};
  events.forEach(ev => {
    const key = ev.rangeStr + "|" + ev.type;
    if(!groups[key]) groups[key] = [];
    groups[key].push(ev);
  });
  const result = [];
  Object.values(groups).forEach(arr => {
    if(arr.length === 1){ result.push(arr[0]); return; }
    // 多筆:過濾掉取消的,留狀態最新的
    const notCancelled = arr.filter(e => e.status !== "取消");
    if(notCancelled.length === 0) return; // 全部取消
    notCancelled.sort((a,b) => (statusOrder[b.status]||0) - (statusOrder[a.status]||0));
    result.push(notCancelled[0]);
  });
  return result;
}

function parseRate(s){if(!s)return null;const m=s.match(/(\d+(?:\.\d+)?)折/);return m?parseFloat(m[1])/100:null;}
function parseTh(s){if(!s)return[];const r=[],re=/滿\s*(\d+)[^\d]*?折\s*(\d+)/g;let m;while((m=re.exec(s))!==null)r.push({threshold:parseInt(m[1]),off:parseInt(m[2])});return r;}

function calc(){
  const price=parseFloat(S.price)||0;if(!price)return null;
  const rate=parseRate(S.brandDiscount);
  const bp=rate?Math.round(price*rate):price,bsaved=price-bp;
  const vt=S.tiers.filter(t=>t.threshold&&parseFloat(t.threshold)>0).map(t=>({threshold:parseFloat(t.threshold),cashOff:parseFloat(t.cashOff)||0,giftName:t.giftName||""})).sort((a,b)=>a.threshold-b.threshold);
  const rt=vt.filter(t=>bp>=t.threshold);
  const bco=rt.reduce((s,t)=>s+t.cashOff,0),ab=bp-bco;
  const nt=vt.find(t=>bp<t.threshold)||null,tg=nt?nt.threshold-bp:0;
  let doff=0,dn="",dg=0;
  if(S.hasDept){
    const th=parseTh(S.deptDiscount);
    if(th.length>0){
      const ap=th.filter(t=>ab>=t.threshold);
      if(ap.length>0){const b=ap.reduce((a,c)=>c.off>a.off?c:a);doff+=b.off;dn+="購物金折$"+b.off;}
      else{const n=th.sort((a,b)=>a.threshold-b.threshold)[0];dg=n.threshold-ab;dn+="差$"+dg+"可折"+n.off;}
    }
    const cth=parseFloat(S.deptCashThresh)||0,co=parseFloat(S.deptCash)||0;
    if(co>0){
      if(cth===0||ab>=cth){doff+=co;dn+=(dn?"＋":"")+"現抵$"+co;}
      else{dg=Math.max(dg,cth-ab);dn+=(dn?",":"")+"差$"+(cth-ab)+"可現抵$"+co;}
    }
    const card=parseFloat(S.deptCard)||0;
    if(card>0){doff+=card;dn+=(dn?"＋":"")+"刷卡折$"+card;}
  }
  const fp=ab-doff,ts=price-fp;
  return{price,bp,bsaved,rt,bco,ab,nt,tg,doff,dn,dg,fp,ts};
}

// 主管 email 關鍵字對應
const MANAGER_MAP = {

function identifyManager(email){
  const prefix = email.split('@')[0].toLowerCase();
  for(const key in MANAGER_MAP){
    if(prefix.includes(key)) return MANAGER_MAP[key];
  }
  return '其他';
}

function getDeviceInfo(){
  const ua = navigator.userAgent;
  if(/iPhone|iPad/.test(ua)) return 'iOS';
  if(/Android/.test(ua)) return 'Android';
  if(/Edg/.test(ua)) return 'Edge';
  if(/Chrome/.test(ua)) return 'Chrome';
  if(/Safari/.test(ua)) return 'Safari';
  if(/Firefox/.test(ua)) return 'Firefox';
  return 'Unknown';
}

function reportLoginEvent(email, status, note){
  // 寫入 Google Sheets (透過 Apps Script)
  if(!LOGIN_CONFIG.APPS_SCRIPT_URL) return;
  try {
    const payload = {
      action: 'login',
      email: email,
      manager: identifyManager(email),
      status: status,
      device: getDeviceInfo(),
      note: note || '',
      timestamp: new Date().toISOString()
    };
    // 用 no-cors 模式,因為 Apps Script 跨域
    fetch(LOGIN_CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(e => console.log('登入記錄上傳失敗:', e));
  } catch(e) {
    console.log('登入記錄錯誤:', e);
  }
}

function showLoginError(msg){
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideLoginError(){
  document.getElementById('login-error').style.display = 'none';
}

function doLogin(){
  hideLoginError();
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const password = document.getElementById('login-password').value;

  // 1. 檢查 email 格式
  if(!email || !email.includes('@')){
    showLoginError('⚠️ 請輸入電郵地址');
    return;
  }

  // 2. 檢查公司網域
  if(!email.endsWith(LOGIN_CONFIG.DOMAIN)){
    showLoginError('⚠️ 請使用公司電郵 (' + LOGIN_CONFIG.DOMAIN + ')');
    reportLoginEvent(email, '✗ 非公司電郵', '非公司網域嘗試');
    return;
  }

  // 3. 檢查密碼
  if(password !== LOGIN_CONFIG.PASSWORD){
    showLoginError('⚠️ 密碼錯誤');
    reportLoginEvent(email, '✗ 密碼錯誤', '');

    // 記錄錯誤次數
    const errKey = 'as_huashu_err_' + email;
    const now = Date.now();
    let errors = [];
    try { errors = JSON.parse(localStorage.getItem(errKey) || '[]'); } catch(e){}
    // 只留 1 小時內的
    errors = errors.filter(t => now - t < 3600 * 1000);
    errors.push(now);
    localStorage.setItem(errKey, JSON.stringify(errors));
    if(errors.length >= 3){
      reportLoginEvent(email, '🚨 連續錯誤', '1小時內第' + errors.length + '次錯誤');
    }
    return;
  }

  // 4. 登入成功
  const expiresAt = Date.now() + LOGIN_CONFIG.REMEMBER_HOURS * 3600 * 1000;
  const session = {email: email, expiresAt: expiresAt};
  localStorage.setItem(LOGIN_CONFIG.STORAGE_KEY, JSON.stringify(session));
  // 清除錯誤記錄
  localStorage.removeItem('as_huashu_err_' + email);

  reportLoginEvent(email, '✓ 登入成功', '');

  showMainApp();
}

function showMainApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-app').style.display = 'block';
  // 觸發主應用的初始化
  if(typeof render === 'function') render();
  if(typeof loadEvents === 'function') loadEvents();
}

function checkSession(){
  try {
    const raw = localStorage.getItem(LOGIN_CONFIG.STORAGE_KEY);
    if(!raw) return false;
    const session = JSON.parse(raw);
    if(!session.expiresAt || Date.now() > session.expiresAt){
      localStorage.removeItem(LOGIN_CONFIG.STORAGE_KEY);
      return false;
    }
    return true;
  } catch(e){
    return false;
  }
}

function doLogout(){
  localStorage.removeItem(LOGIN_CONFIG.STORAGE_KEY);
  location.reload();
}

  if(checkSession()){

  } else {

    document.getElementById('main-app').style.display = 'none';
    // Enter 鍵登入
    document.getElementById('login-password').addEventListener('keypress', function(e){
      if(e.key === 'Enter') doLogin();
    });
    document.getElementById('login-email').addEventListener('keypress', function(e){
      if(e.key === 'Enter') document.getElementById('login-password').focus();
    });
  }
});

</script>
</body>
</html>
