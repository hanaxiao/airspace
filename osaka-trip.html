<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大阪五天四夜｜親子自由行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#FFFCF6; --ink:#3E3A39; --coral:#F2A497; --yama:#F6D27A; --mizu:#A8D3E6; --waka:#B9DAA5;
  --r:22px; --bw:3px;
}
*{box-sizing:border-box;}
html{scroll-padding-top:70px;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Huninn','PingFang TC','Microsoft JhengHei',sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:20;}
h1,h2,h3{margin:0;}
.nav{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:var(--bw) solid var(--ink);
  padding:10px 16px calc(10px + env(safe-area-inset-top,0px)); padding-top:calc(10px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:8px;}
.nav b{font-size:18px;}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px;}
.card{background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--r);padding:16px;margin-bottom:16px;}
.hero{text-align:center;padding:24px 16px 10px;}
.hero svg{width:min(260px,70vw);height:auto;}
.hero h1{font-size:28px;margin:10px 0 4px;}
.hero p{margin:0;opacity:.75;font-size:14px;}
.countdown{display:inline-block;margin-top:10px;background:var(--yama);border:var(--bw) solid var(--ink);
  border-radius:999px;padding:8px 18px;font-size:15px;font-weight:bold;}
.sway{animation:sway 4s ease-in-out infinite;}
@keyframes sway{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-6px) rotate(-1.5deg);}}
.flights{display:flex;gap:12px;flex-wrap:wrap;}
.flight{flex:1 1 220px;background:var(--mizu);border:var(--bw) solid var(--ink);border-radius:var(--r);padding:14px;}
.flight b{font-size:14px;display:block;margin-bottom:6px;}
.flight .t{font-size:20px;font-weight:bold;}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
.tab{flex:0 0 auto;border:var(--bw) solid var(--ink);background:#fff;border-radius:999px;padding:8px 14px;
  font-family:inherit;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.tab.active{background:var(--coral);}
.tab svg{width:20px;height:20px;}
.daytitle{font-size:18px;margin-bottom:12px;}
.timeline{position:relative;padding-left:18px;border-left:3px dashed var(--ink);}
.item{position:relative;margin-bottom:18px;}
.item::before{content:"";position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;
  background:var(--waka);border:3px solid var(--ink);}
.item .time{font-weight:bold;font-size:13px;opacity:.8;}
.item .title{font-size:16px;font-weight:bold;margin:2px 0 4px;}
.item .note{font-size:13px;opacity:.75;}
.tag{display:inline-block;font-size:11px;border:2px solid var(--ink);border-radius:999px;padding:2px 9px;margin-right:6px;font-weight:bold;}
.must{display:inline-block;font-size:11px;border:2px solid var(--ink);background:var(--coral);border-radius:999px;padding:2px 9px;font-weight:bold;}
.bounce{animation:bounce .45s ease;}
@keyframes bounce{0%{transform:scale(.96) translateY(6px);opacity:0;}60%{transform:scale(1.01) translateY(-2px);opacity:1;}100%{transform:scale(1) translateY(0);}}
.check-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed #ddd;font-size:14px;}
.check-row:last-child{border-bottom:none;}
.check-row input{width:20px;height:20px;accent-color:var(--waka);flex:0 0 auto;margin-top:1px;}
.check-row.done span{text-decoration:line-through;opacity:.45;}
.hotelbox p{margin:4px 0;font-size:14px;}
.hotelbox .name{font-size:17px;font-weight:bold;margin-bottom:6px;}
@media (prefers-reduced-motion: reduce){.sway{animation:none;}.bounce{animation:none;}}
</style>
</head>
<body>
<div class="nav"><b>🏯 大阪親子自由行</b></div>
<div class="wrap">

  <div class="hero">
    <svg class="sway" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="100" cy="148" rx="80" ry="8" fill="var(--waka)" opacity=".5"/>
      <rect x="60" y="70" width="80" height="60" fill="var(--coral)" stroke="var(--ink)" stroke-width="3"/>
      <polygon points="50,70 100,35 150,70" fill="var(--yama)" stroke="var(--ink)" stroke-width="3"/>
      <rect x="90" y="95" width="20" height="35" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>
      <circle cx="160" cy="30" r="14" fill="var(--mizu)" stroke="var(--ink)" stroke-width="3"/>
      <path d="M20 40 q20 -10 40 0" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M15 55 q20 -10 40 0" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <h1>大阪五天四夜</h1>
    <p>2026/10/30 — 11/3　2大＋1位4歲小孩</p>
    <div class="countdown" id="countdown">計算中...</div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:10px;">✈️ 航班</h3>
    <div class="flights">
      <div class="flight"><b>去程　10/30（五）</b><div class="t">08:05 台北 → 11:35 大阪</div>華航</div>
      <div class="flight"><b>回程　11/3（二）</b><div class="t">14:30 大阪 → 16:50 台北</div>華航</div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:12px;">📅 每日行程</h3>
    <div class="tabs" id="tabs"></div>
    <div class="daytitle" id="daytitle"></div>
    <div class="timeline" id="timeline"></div>
  </div>

  <div class="card hotelbox">
    <h3 style="margin-bottom:10px;">🏨 住宿資訊</h3>
    <div class="name">通天閣悅庭嵐舍</div>
    <p>〒556-0002 大阪府大阪市浪速区恵美須東1丁目8-4</p>
    <p>電話：+81 80-5818-0258</p>
    <p>入住 10/30　／　退房 11/3</p>
  </div>

  <div class="card">
    <h3 style="margin-bottom:6px;">✅ 最後確認清單</h3>
    <div id="checklist"></div>
  </div>

</div>

<script>
const ICONS = {
  plane:'<svg viewBox="0 0 24 24"><path d="M2 16l20-7-20-7 4 7z" fill="var(--coral)" stroke="var(--ink)" stroke-width="1.5"/></svg>',
  castle:'<svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" fill="var(--yama)" stroke="var(--ink)" stroke-width="1.5"/><polygon points="3,10 12,4 21,10" fill="var(--coral)" stroke="var(--ink)" stroke-width="1.5"/></svg>',
  fish:'<svg viewBox="0 0 24 24"><ellipse cx="10" cy="12" rx="8" ry="5" fill="var(--mizu)" stroke="var(--ink)" stroke-width="1.5"/><polygon points="18,12 23,7 23,17" fill="var(--mizu)" stroke="var(--ink)" stroke-width="1.5"/></svg>',
  torii:'<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="3" fill="var(--coral)" stroke="var(--ink)" stroke-width="1.5"/><rect x="5" y="9" width="3" height="12" fill="var(--coral)" stroke="var(--ink)" stroke-width="1.5"/><rect x="16" y="9" width="3" height="12" fill="var(--coral)" stroke="var(--ink)" stroke-width="1.5"/></svg>',
  pagoda:'<svg viewBox="0 0 24 24"><polygon points="12,2 22,8 2,8" fill="var(--waka)" stroke="var(--ink)" stroke-width="1.5"/><rect x="9" y="8" width="6" height="13" fill="var(--waka)" stroke="var(--ink)" stroke-width="1.5"/></svg>'
};
const TAGCOLOR = {'步行':'var(--waka)','地鐵':'var(--mizu)','JR':'var(--coral)','巴士':'var(--yama)','南海':'var(--coral)','活動':'#eee'};

const days = [
{date:'10/30（五）', title:'抵達＋臨空城', icon:'plane', items:[
  {time:'08:05', tag:'活動', title:'桃園機場出發', note:'華航'},
  {time:'11:35', tag:'活動', title:'抵達關西機場 T1', note:'入境、領行李，約60～75分'},
  {time:'12:45', tag:'巴士', title:'機場 → Rinku Premium', note:'接駁巴士約15分，成人¥300'},
  {time:'13:00–16:00', tag:'活動', title:'臨空城 Outlet', note:'Outlet內步行約3小時', must:1},
  {time:'16:00', tag:'南海', title:'臨空城 → 惠美須町', note:'南海電鐵轉乘，約50～60分'},
  {time:'17:15', tag:'步行', title:'惠美須町 → 飯店', note:'通天閣悅庭嵐舍，步行約10分'},
  {time:'19:00–20:30', tag:'活動', title:'第一晚晚餐', note:'惠美須町／新世界附近，一家三口¥4,000～6,000', must:1},
]},
{date:'10/31（六）', title:'大阪城＋黑門市場＋大人生日', icon:'castle', items:[
  {time:'08:45', tag:'步行', title:'飯店 → 惠美須町／難波方向', note:'約10～15分'},
  {time:'09:40–11:30', tag:'地鐵', title:'大阪城公園／天守閣', note:'谷町四丁目9號出口，成人¥1,200', must:1},
  {time:'11:30–13:00', tag:'活動', title:'午餐', note:'大阪城周邊，一家三口¥4,000～5,000'},
  {time:'13:40–14:40', tag:'地鐵', title:'黑門市場', note:'日本橋站10號出口方向，步行約15分', must:1},
  {time:'14:40–16:10', tag:'步行', title:'道頓堀＋心齋橋', note:'步行約20～30分'},
  {time:'18:30–20:30', tag:'活動', title:'大人生日居酒屋', note:'日本橋／難波一帶，成人約¥2,000～4,000/人', must:1},
]},
{date:'11/1（日）', title:'海遊館＋兒子生日', icon:'fish', items:[
  {time:'08:30', tag:'活動', title:'早餐', note:'飯店附近'},
  {time:'09:40–12:30', tag:'地鐵', title:'海遊館', note:'約3小時，票價待官方當日票價', must:1},
  {time:'12:30–13:30', tag:'活動', title:'天保山午餐', note:'一家三口¥4,000～5,500'},
  {time:'13:30–14:20', tag:'活動', title:'天保山摩天輪／LEGOLAND', note:'可選，累了可取消'},
  {time:'15:00–17:00', tag:'步行', title:'回飯店休息', note:'保留體力，避免4歲小孩太累'},
  {time:'17:30–19:30', tag:'活動', title:'兒子生日晚餐', note:'親子友善餐廳，一家三口¥6,000～10,000', must:1},
]},
{date:'11/2（一）', title:'清水寺＋teamLab長居植物園', icon:'torii', items:[
  {time:'09:30', tag:'JR', title:'JR大阪 → JR京都', note:'新快速約28分'},
  {time:'10:30–12:30', tag:'巴士', title:'清水寺參觀', note:'烏丸口D2乘車處搭206系統，仁王門、舞台展望', must:1},
  {time:'12:30–13:30', tag:'步行', title:'三年坂・二年坂', note:'石板坡道，小吃、散策', must:1},
  {time:'13:30–15:00', tag:'步行', title:'祇園・花見小路', note:'較平坦，適合拍照'},
  {time:'15:45', tag:'JR', title:'JR京都 → JR大阪', note:'新快速約28分'},
  {time:'16:30', tag:'地鐵', title:'梅田 → 長居', note:'御堂筋線直達約25分'},
  {time:'18:00–20:00', tag:'活動', title:'teamLab 長居植物園', note:'夜間燈光藝術展，4歲學前免門票', must:1},
]},
{date:'11/3（二）', title:'四天王寺＋回台', icon:'pagoda', items:[
  {time:'07:30', tag:'活動', title:'早餐', note:'飯店附近'},
  {time:'08:15', tag:'活動', title:'退房／寄放行李', note:''},
  {time:'08:30–09:45', tag:'步行', title:'四天王寺', note:'可刪項目，約1～1.25小時'},
  {time:'10:30', tag:'步行', title:'飯店 → 難波', note:'約10～12分'},
  {time:'10:45', tag:'南海', title:'難波 → 關西機場', note:'特急ラピート，約38～45分', must:1},
  {time:'14:30', tag:'活動', title:'起飛（華航）', note:'距登機約1.5～2小時前抵達機場'},
  {time:'16:50', tag:'活動', title:'抵達桃園機場', note:''},
]},
];

const checklistItems = [
  '10/31 大阪城天守閣開放時間與門票',
  '10/31 大人生日居酒屋訂位',
  '11/1 海遊館票價與指定入館時間',
  '11/1 兒子生日餐廳訂位',
  '11/2 清水寺開放時間與門票',
  '11/2 teamLab長居植物園開放時間與公休日',
  '11/3 關西機場出發車次與行李動線',
];

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let current = 0;

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = days.map((d,i)=>`<button class="tab${i===current?' active':''}" data-i="${i}">${ICONS[d.icon]}${d.date.slice(0,5)}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{current=+b.dataset.i;render();}));
}
function render(){
  renderTabs();
  const d = days[current];
  document.getElementById('daytitle').textContent = d.date + '　' + d.title;
  const tl = document.getElementById('timeline');
  tl.innerHTML = d.items.map(it=>`
    <div class="item">
      <div class="time">${it.time}</div>
      <div class="title">${it.title}${it.must?' <span class="must">必去</span>':''}</div>
      <span class="tag" style="background:${TAGCOLOR[it.tag]||'#eee'}">${it.tag}</span>
      <div class="note">${it.note||''}</div>
    </div>`).join('');
  if(!reduceMotion){ tl.classList.remove('bounce'); void tl.offsetWidth; tl.classList.add('bounce'); }
}
render();

// countdown
function pad(n){return n<10?'0'+n:n;}
function updateCountdown(){
  const dep = new Date('2026-10-30T08:05:00+09:00');
  const now = new Date();
  const diff = dep - now;
  const el = document.getElementById('countdown');
  if(diff > 0){
    const days_ = Math.floor(diff/86400000), hrs = Math.floor((diff%86400000)/3600000);
    el.textContent = `距離出發還有 ${days_} 天 ${hrs} 小時`;
  } else {
    const ret = new Date('2026-11-03T16:50:00+08:00');
    el.textContent = now < ret ? '旅途進行中 🎒' : '旅程已結束，期待下一次！';
  }
}
updateCountdown(); setInterval(updateCountdown, 60000);

// checklist with localStorage
(function(){
  const box = document.getElementById('checklist');
  let saved = {};
  try{ saved = JSON.parse(localStorage.getItem('osaka-checklist')||'{}'); }catch(e){}
  box.innerHTML = checklistItems.map((t,i)=>`
    <label class="check-row${saved[i]?' done':''}">
      <input type="checkbox" data-i="${i}" ${saved[i]?'checked':''}>
      <span>${t}</span>
    </label>`).join('');
  box.querySelectorAll('input').forEach(cb=>cb.addEventListener('change',()=>{
    const row = cb.closest('.check-row');
    row.classList.toggle('done', cb.checked);
    saved[cb.dataset.i] = cb.checked;
    try{ localStorage.setItem('osaka-checklist', JSON.stringify(saved)); }catch(e){}
  }));
})();
</script>
</body>
</html>
